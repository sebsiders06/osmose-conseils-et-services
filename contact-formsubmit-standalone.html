<!DOCTYPE html>
<!--
  Formulaire FormSubmit — autonome (HTML + CSS inline, aucune librairie).
  AVANT MISE EN LIGNE :
  1) Dans le champ _next, indiquez l’URL de la page de remerciement : par défaut c’est le fichier
     « merci-formsubmit-standalone.html » au même dossier ; en production, utilisez de préférence
     une URL absolue (https://…/merci-formsubmit-standalone.html) si la redirection ne fonctionne pas.
  2) Confirmez votre adresse sur FormSubmit lors du premier envoi.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Osmose Conseils &amp; Services</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
        color: #0f1419;
        background: linear-gradient(160deg, #eef5f3 0%, #e8edf5 50%, #f5f2ee 100%);
        padding: 2rem 1rem 3rem;
      }
      .wrap {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
      }
      h1 {
        font-size: clamp(1.35rem, 4vw, 1.65rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
        text-align: center;
        color: #14221f;
      }
      .lede {
        margin: 0 0 1.75rem;
        font-size: 0.95rem;
        color: #4a5568;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 18px;
        padding: 1.75rem 1.5rem 1.85rem;
        box-shadow: 0 12px 40px rgba(15, 35, 52, 0.09), 0 2px 8px rgba(15, 35, 52, 0.04);
        border: 1px solid rgba(123, 156, 150, 0.2);
      }
      label {
        display: grid;
        gap: 0.4rem;
        margin-bottom: 1.05rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #1e2d2a;
      }
      .req {
        color: #5a7f78;
        font-weight: 500;
      }
      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 0.75rem 0.9rem;
        font: inherit;
        border: 1px solid #c5d4cf;
        border-radius: 10px;
        background: #fafcfb;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #6b9a90;
        box-shadow: 0 0 0 3px rgba(107, 154, 144, 0.22);
        background: #fff;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      .honeypot {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      .actions {
        margin-top: 0.25rem;
      }
      button[type="submit"] {
        width: 100%;
        padding: 0.9rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(165deg, #2d4a44, #1e3430);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(30, 52, 48, 0.35);
        transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
      }
      button[type="submit"]:hover {
        filter: brightness(1.06);
        box-shadow: 0 6px 20px rgba(30, 52, 48, 0.42);
      }
      button[type="submit"]:active {
        transform: translateY(1px);
      }
      .fineprint {
        margin: 1.25rem 0 0;
        font-size: 0.78rem;
        color: #64748b;
        text-align: center;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Nous écrire</h1>
      <p class="lede">Laissez un message : nous vous répondrons rapidement.</p>

      <div class="card">
        <form
          action="https://formsubmit.co/philippe.clemente@orange.fr"
          method="POST"
        >
          <!-- URL absolue recommandée (ex. https://www.mondomaine.fr/merci-formsubmit-standalone.html) -->
          <input type="hidden" name="_next" value="merci-formsubmit-standalone.html" />
          <input type="hidden" name="_captcha" value="true" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_subject" value="Message — formulaire site Osmose Conseils" />

          <div class="honeypot" aria-hidden="true">
            <label>
              Ne pas remplir
              <input type="text" name="_honey" autocomplete="off" tabindex="-1" />
            </label>
          </div>

          <label>
            Nom <span class="req">*</span>
            <input type="text" name="name" placeholder="Votre nom" required autocomplete="name" />
          </label>

          <label>
            E-mail <span class="req">*</span>
            <input type="email" name="email" placeholder="vous@exemple.fr" required autocomplete="email" />
          </label>

          <label>
            Sujet <span class="req">*</span>
            <input type="text" name="subject" placeholder="Objet de votre message" required />
          </label>

          <label>
            Message <span class="req">*</span>
            <textarea name="message" placeholder="Votre message…" required></textarea>
          </label>

          <div class="actions">
            <button type="submit">Envoyer</button>
          </div>
        </form>
      </div>

      <p class="fineprint">
        En envoyant ce formulaire, vous passerez une vérification anti-robot (reCAPTCHA) et nous recevrons les champs sous forme de tableau par e-mail.
      </p>
    </div>
  </body>
</html>
