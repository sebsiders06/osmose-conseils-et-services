<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message envoyé</title>
    <meta name="robots" content="noindex" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #14221f;
        background: linear-gradient(160deg, #eef5f3 0%, #e8edf5 100%);
      }
      .box {
        max-width: 420px;
        text-align: center;
        background: #fff;
        padding: 2rem 1.75rem;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(15, 35, 52, 0.09);
        border: 1px solid rgba(123, 156, 150, 0.2);
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4a5568;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(165deg, #2d4a44, #1e3430);
        border-radius: 10px;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(1.07);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Merci pour votre message</h1>
      <p>Nous avons bien reçu votre demande et vous répondrons dès que possible.</p>
      <a href="contact-formsubmit-standalone.html">Retour au formulaire</a>
    </div>
  </body>
</html>
